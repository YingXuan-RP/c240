<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Set your study preferences for better partner matching.">
  <title>Study Preferences - Study Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="dashboard-header">
    <div class="dashboard-nav">
      <a href="dashboard.html" class="brand">Study Connect</a>
      <nav class="dashboard-nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Edit Profile</a>
      </nav>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header-content">
          <h1>Study Preferences</h1>
          <p>Set your preferences for better partner matching</p>
        </div>

        <form id="preferencesForm" class="preferences-form">
          <!-- Session Preferences Section -->
          <div class="preferences-section">
            <h2 class="section-title">📚 Session Preferences</h2>
            
            <div class="form-row">
              <div class="form-col">
                <label for="studyStyle" class="form-label">Study Style</label>
                <select id="studyStyle" name="studyStyle" class="form-select" required>
                  <option value="">Choose your style</option>
                  <option value="solo-focus">Solo Focus (work independently)</option>
                  <option value="collaborative">Collaborative (discuss together)</option>
                  <option value="teaching">Teaching & Explaining</option>
                  <option value="problem-solving">Problem Solving</option>
                  <option value="review-sessions">Review Sessions</option>
                </select>
              </div>
              
              <div class="form-col">
                <label for="sessionLength" class="form-label">Session Length</label>
                <select id="sessionLength" name="sessionLength" class="form-select" required>
                  <option value="">Choose duration</option>
                  <option value="30min">30 minutes</option>
                  <option value="1hour">1 hour</option>
                  <option value="2hours">2 hours</option>
                  <option value="3hours">3+ hours</option>
                </select>
              </div>
            </div>

            <div class="form-row full-span">
              <label for="studyLocation" class="form-label">Study Location</label>
              <select id="studyLocation" name="studyLocation" class="form-select" required>
                <option value="">Choose location</option>
                <option value="library">📖 Library</option>
                <option value="cafe">☕ Café</option>
                <option value="campus">🏫 Campus Study Rooms</option>
                <option value="online">💻 Online/Virtual</option>
                <option value="flexible">🤝 Flexible</option>
              </select>
            </div>
          </div>

          <!-- Availability Section -->
          <div class="preferences-section">
            <h2 class="section-title">⏰ Your Availability</h2>
            <p class="section-desc">When are you typically free to study?</p>
            <div class="availability-grid">
              <label class="availability-chip">
                <input type="checkbox" name="availability" value="Weekday Mornings">
                <span>🌅 Weekday Mornings</span>
              </label>
              <label class="availability-chip">
                <input type="checkbox" name="availability" value="Weekday Afternoons">
                <span>☀️ Weekday Afternoons</span>
              </label>
              <label class="availability-chip">
                <input type="checkbox" name="availability" value="Weekday Evenings">
                <span>🌙 Weekday Evenings</span>
              </label>
              <label class="availability-chip">
                <input type="checkbox" name="availability" value="Weekend Mornings">
                <span>🌅 Weekend Mornings</span>
              </label>
              <label class="availability-chip">
                <input type="checkbox" name="availability" value="Weekend Afternoons">
                <span>☀️ Weekend Afternoons</span>
              </label>
              <label class="availability-chip">
                <input type="checkbox" name="availability" value="Weekend Evenings">
                <span>🌙 Weekend Evenings</span>
              </label>
            </div>
          </div>

          <!-- Study Interests Section -->
          <div class="preferences-section">
            <h2 class="section-title">🎯 Study Interests</h2>
            <p class="section-desc">Select topics you'd like to study (optional - overrides profile)</p>
            <div class="interests-grid">
              <label class="interest-chip">
                <input type="checkbox" name="interests" value="Programming">
                <span>💻 Programming</span>
              </label>
              <label class="interest-chip">
                <input type="checkbox" name="interests" value="Exam Prep">
                <span>📝 Exam Prep</span>
              </label>
              <label class="interest-chip">
                <input type="checkbox" name="interests" value="Group Projects">
                <span>👥 Group Projects</span>
              </label>
              <label class="interest-chip">
                <input type="checkbox" name="interests" value="Machine Learning">
                <span>🤖 Machine Learning</span>
              </label>
              <label class="interest-chip">
                <input type="checkbox" name="interests" value="Web Development">
                <span>🌐 Web Development</span>
              </label>
              <label class="interest-chip">
                <input type="checkbox" name="interests" value="Data Analysis">
                <span>📊 Data Analysis</span>
              </label>
              <label class="interest-chip">
                <input type="checkbox" name="interests" value="Business Strategy">
                <span>📈 Business Strategy</span>
              </label>
              <label class="interest-chip">
                <input type="checkbox" name="interests" value="Research">
                <span>🔬 Research</span>
              </label>
              <label class="interest-chip">
                <input type="checkbox" name="interests" value="Design">
                <span>🎨 Design</span>
              </label>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="preferences-section action-section">
            <button type="submit" class="btn primary">✓ Save Preferences</button>
            <a href="dashboard.html" class="btn ghost">← Back to Dashboard</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.initPreferences();
    });
  </script>
</body>
</html>
