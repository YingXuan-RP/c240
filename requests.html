<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse study requests posted by other students.">
  <title>Study Requests - Study Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="dashboard-header">
    <div class="dashboard-nav">
      <a href="dashboard.html" class="brand">Study Connect</a>
      <nav class="dashboard-nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Edit Profile</a>
      </nav>
    </div>
  </header>

  <main class="dashboard">
    <div class="welcome-section">
      <div class="welcome-content">
        <h1>Browse Study Requests</h1>
        <p class="subtitle">Find study sessions posted by other students</p>
      </div>
    </div>

    <section class="dashboard-section">
      <div class="filter-bar">
        <div class="filter-group">
          <label for="filterSchool">School</label>
          <select id="filterSchool" class="filter-select">
            <option value="">All Schools</option>
            <option value="infocomm">School of Infocomm</option>
            <option value="business">School of Business</option>
            <option value="appliedscience">School of Applied Science</option>
            <option value="engineering">School of Engineering</option>
            <option value="tech-arts">School of Technology for the Arts</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterSubject">Subject</label>
          <select id="filterSubject" class="filter-select">
            <option value="">All Subjects</option>
            <option value="Programming">Programming</option>
            <option value="Machine Learning">Machine Learning</option>
            <option value="Web Development">Web Development</option>
            <option value="Data Analysis">Data Analysis</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Business Strategy">Business Strategy</option>
            <option value="Engineering">Engineering</option>
          </select>
        </div>
        <button class="btn ghost" id="resetFiltersBtn">Reset Filters</button>
      </div>

      <div class="grid cards" id="requestsGrid">
        <!-- Study request cards will be populated here by JavaScript -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <div>
      <p class="brand-mark">Study Connect</p>
      <p class="footer-text">Designed for collaborative, engaged students.</p>
    </div>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="#">Help</a>
    </div>
  </footer>

  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.initRequests();
    });
  </script>
</body>
</html>
