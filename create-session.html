<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a new study session and invite partners.">
  <title>Create Study Session - Study Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a href="dashboard.html" class="brand">Study Connect</a>
  </header>

  <main class="auth-shell">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header-content">
          <h1>Create Study Session</h1>
          <p>Post your own study session and invite partners to join</p>
        </div>

        <form id="createSessionForm" class="auth-form">
          <div class="form-group">
            <label for="sessionTitle">Session Title <span class="required">*</span></label>
            <input type="text" id="sessionTitle" name="sessionTitle" placeholder="e.g. Machine Learning Study Group" required>
            <span class="error-msg" id="titleError"></span>
          </div>

          <div class="form-group">
            <label for="subject">Subject / Topic <span class="required">*</span></label>
            <select id="subject" name="subject" required>
              <option value="">Select subject</option>
              <option value="Programming">Programming</option>
              <option value="Machine Learning">Machine Learning</option>
              <option value="Web Development">Web Development</option>
              <option value="Data Analysis">Data Analysis</option>
              <option value="Mathematics">Mathematics</option>
              <option value="Business Strategy">Business Strategy</option>
              <option value="Engineering">Engineering</option>
              <option value="Exam Prep">Exam Prep</option>
              <option value="Group Projects">Group Projects</option>
              <option value="Research">Research</option>
              <option value="Design">Design</option>
            </select>
            <span class="error-msg" id="subjectError"></span>
          </div>

          <div class="form-group">
            <label for="sessionDate">Date <span class="required">*</span></label>
            <input type="date" id="sessionDate" name="sessionDate" required>
            <span class="error-msg" id="dateError"></span>
          </div>

          <div class="form-group">
            <label for="sessionTime">Start Time <span class="required">*</span></label>
            <input type="time" id="sessionTime" name="sessionTime" required>
            <span class="error-msg" id="timeError"></span>
          </div>

          <div class="form-group">
            <label for="duration">Duration <span class="required">*</span></label>
            <select id="duration" name="duration" required>
              <option value="">Select duration</option>
              <option value="1 hour">1 hour</option>
              <option value="2 hours">2 hours</option>
              <option value="3 hours">3 hours</option>
              <option value="4+ hours">4+ hours</option>
            </select>
            <span class="error-msg" id="durationError"></span>
          </div>

          <div class="form-group">
            <label for="location">Location <span class="required">*</span></label>
            <select id="location" name="location" required>
              <option value="">Select location</option>
              <option value="Library">Library</option>
              <option value="Study Room">Study Room</option>
              <option value="Café">Café</option>
              <option value="Online via Teams">Online via Teams</option>
              <option value="Online via Zoom">Online via Zoom</option>
              <option value="Campus Study Area">Campus Study Area</option>
              <option value="Computer Lab">Computer Lab</option>
            </select>
            <span class="error-msg" id="locationError"></span>
          </div>

          <div class="form-group">
            <label for="maxParticipants">Max Participants <span class="required">*</span></label>
            <input type="number" id="maxParticipants" name="maxParticipants" min="2" max="20" value="4" required>
            <span class="helper-text">Between 2 and 20 people</span>
            <span class="error-msg" id="participantsError"></span>
          </div>

          <div class="form-group full-span">
            <label for="description">Description / Details</label>
            <textarea id="description" name="description" rows="4" placeholder="Describe what you'll be studying, any preparation needed, or other details..."></textarea>
            <span class="helper-text">Optional - helps others understand what to expect</span>
          </div>

          <div class="form-group full-span">
            <label>Study Interests <span class="required">*</span></label>
            <p class="helper-text">Select all that apply</p>
            <div class="checkbox-grid">
              <label class="checkbox-label">
                <input type="checkbox" name="interests" value="Programming">
                <span>Programming</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="interests" value="Exam Prep">
                <span>Exam Prep</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="interests" value="Group Projects">
                <span>Group Projects</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="interests" value="Machine Learning">
                <span>Machine Learning</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="interests" value="Web Development">
                <span>Web Development</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="interests" value="Data Analysis">
                <span>Data Analysis</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="interests" value="Business Strategy">
                <span>Business Strategy</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="interests" value="Research">
                <span>Research</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="interests" value="Design">
                <span>Design</span>
              </label>
            </div>
            <span class="error-msg" id="interestsError"></span>
          </div>

          <div class="form-group full-span button-row">
            <button type="submit" class="btn primary">Create Session</button>
            <a href="dashboard.html" class="btn ghost">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.initCreateSession();
    });
  </script>
</body>
</html>
