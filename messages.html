<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View your messages and chat with study partners.">
  <title>Messages - Study Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="dashboard-header">
    <div class="dashboard-nav">
      <a href="index.html" class="brand">Study Connect</a>
      <nav class="dashboard-nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Edit Profile</a>
      </nav>
    </div>
  </header>

  <main class="dashboard">
    <div class="welcome-section">
      <div class="welcome-content">
        <h1>Messages</h1>
        <p class="subtitle">Chat with your study partners</p>
      </div>
    </div>

    <section class="dashboard-section">
      <div class="messages-container">
        <div class="conversations-sidebar">
          <h3>Conversations</h3>
          <div id="conversationsList" class="conversations-list">
            <!-- Conversation items will be populated here by JavaScript -->
          </div>
        </div>
        
        <div class="chat-view">
          <div id="chatHeader" class="chat-view-header">
            <p>Select a conversation to start chatting</p>
          </div>
          <div id="chatContent" class="chat-messages-view">
            <!-- Chat messages will be displayed here -->
          </div>
          <div id="chatInput" class="chat-input-area" style="display: none;">
            <input type="text" id="messageInput" placeholder="Type your message..." aria-label="Message input">
            <button id="sendMessageBtn" class="btn primary">Send</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div>
      <p class="brand-mark">Study Connect</p>
      <p class="footer-text">Designed for collaborative, engaged students.</p>
    </div>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="#">Help</a>
    </div>
  </footer>

  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.initMessages();
    });
  </script>
</body>
</html>
