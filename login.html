<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to Study Connect to view your study hub.">
  <title>Login - Study Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a href="index.html" class="brand">Study Connect</a>
  </header>

  <main class="auth-shell">
    <div class="auth-container">
      <div class="auth-card">
        <a href="index.html" class="auth-logo">Study Connect</a>
        <div class="auth-header">
          <h1>Welcome back</h1>
          <p>Sign in to view your study hub</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="email">School email</label>
            <input type="email" id="email" name="email" placeholder="you@school.edu" required>
            <span class="error-msg" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            <span class="error-msg" id="passwordError"></span>
          </div>

          <button type="submit" class="btn primary full-width">Sign in</button>
          <span class="error-msg" id="loginError"></span>
        </form>

        <div class="auth-footer">
          <p>Don't have a profile? <a href="profile.html">Create one</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
